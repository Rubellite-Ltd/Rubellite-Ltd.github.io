  :root {
    --text: #111111;
    --muted: #666666;
    --bg: #F2F2F3;
    --white: #FFFFFF;
    --accent: #F2A63D;
    --border: #D9D9DD;
  }

  * { box-sizing: border-box; }

  body {

    background: var(--bg);

    margin: 0 auto;
    padding: 32px 24px 96px;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: center;
    margin-bottom: 32px;
  }

  .back-home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
  }

  .back-home:hover {
    color: var(--accent);
  }

  .back-icon {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--white);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, border-color .15s;
  }

  .back-home:hover .back-icon {
    background: var(--accent);
    border-color: var(--accent);
  }

    margin: 0 0 4px;

    padding-bottom: 8px;

  }
